<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Line - Social Hub</title>
    
    <!-- Firebase App & Firestore CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            z-index: 10;
        }

        .top-bar-logo {
            height: 35px;
            object-fit: contain;
        }

        .top-bar-title {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        #splashScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }

        .splash-logo-img {
            width: 180px;
            max-width: 70%;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .page { display: none; }
        .page.active { display: block; }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }

        input:focus { outline: none; border-color: #38bdf8; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #0284c7, #2563eb);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add {
            background: #334155;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* 3D EARTH GLOBE SPHERE CONTAINER */
        .globe-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 15px auto 30px;
            perspective: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(15,23,42,0.8) 70%);
            border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 25px rgba(56, 189, 248, 0.2), 0 0 20px rgba(2, 132, 199, 0.3);
        }

        .globe-sphere {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateGlobe 20s linear infinite;
        }

        .globe-sphere:hover {
            animation-play-state: paused;
        }

        .globe-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 50px;
            height: 50px;
            margin-left: -25px;
            margin-top: -25px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            cursor: pointer;
            background: #0f172a;
        }

        .globe-item img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .globe-item span {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: #cbd5e1;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.9);
            padding: 1px 5px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        @keyframes rotateGlobe {
            0% { transform: rotateY(0deg) rotateX(15deg); }
            100% { transform: rotateY(360deg) rotateX(15deg); }
        }

        .global-section h3 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .global-users {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .user-circle-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            cursor: pointer;
        }

        .profile-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            padding: 2px;
        }

        .user-circle-card span {
            font-size: 0.75rem;
            margin-top: 5px;
            color: #cbd5e1;
            text-align: center;
            max-width: 70px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .insta-profile-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
        }

        .insta-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
        }

        .insta-code-badge {
            display: inline-block;
            background: #0284c7;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .link-item {
            display: block;
            background: #0f172a;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #334155;
            word-break: break-all;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 65px;
            background-color: #0f172a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1e293b;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-bar">
            <img src="logo.png" class="top-bar-logo" alt="Practical Logo">
            <span class="top-bar-title">PRACTICAL LINE</span>
        </div>

        <div id="splashScreen">
            <img src="logo.png" class="splash-logo-img" alt="Practical Logo">
            <div class="loader"></div>
        </div>

        <div class="main-content">

            <div id="searchPage" class="page active">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Search Profile</h2>
                <div class="search-box">
                    <input type="number" id="searchInput" placeholder="Enter 4-Digit Code" maxlength="4">
                    <button class="btn" style="width: auto; padding: 0 20px;" onclick="searchByCode()">Search</button>
                </div>

                <!-- 3D EARTH GLOBE ROTATING SPHERE -->
                <div class="global-section">
                    <h3>Global Earth 3D Creators</h3>
                    <div class="globe-container">
                        <div class="globe-sphere" id="globeSphere"></div>
                    </div>
                </div>

                <div class="global-section">
                    <h3>All Global Creators</h3>
                    <div class="global-users" id="globalUsersList"></div>
                </div>
            </div>

            <div id="joinPage" class="page">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Join Practical Line</h2>
                
                <input type="text" id="regName" placeholder="Mee Peru (Full Name)">
                
                <label style="font-size: 0.85rem; color: #94a3b8; display:block; margin: 5px 0;">Mee Photo Select Cheyandi:</label>
                <input type="file" id="regPhotoFile" accept="image/*" onchange="convertImage(event)" style="padding: 10px; margin-bottom: 12px;">

                <label style="font-size: 0.85rem; color: #94a3b8; display:block; margin: 10px 0 5px;">Social Media Links:</label>
                <div id="linksContainer">
                    <input type="url" class="social-link-input" placeholder="App Link 1 (e.g. Instagram)">
                    <input type="url" class="social-link-input" placeholder="App Link 2 (e.g. YouTube)">
                    <input type="url" class="social-link-input" placeholder="App Link 3 (e.g. Moj)">
                </div>

                <button class="btn btn-add" onclick="addMoreLinkBox()">+ Add More Link</button>
                <button class="btn" onclick="registerUser()">Generate Code & Join</button>
            </div>

            <div id="profilePage" class="page">
                <div id="profileContainer"></div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('searchPage', this)">
                <div class="nav-icon">🔍</div>
                <div>Search</div>
            </div>
            <div class="nav-item" onclick="switchPage('joinPage', this)">
                <div class="nav-icon">➕</div>
                <div>Join</div>
            </div>
            <div class="nav-item" onclick="switchPage('profilePage', this)">
                <div class="nav-icon">👤</div>
                <div>Profile</div>
            </div>
        </div>

    </div>

    <script>
        // --- REAL FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForPracticalLineHub-Demo",
            authDomain: "practical-line.firebaseapp.com",
            projectId: "practical-line",
            storageBucket: "practical-line.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2000);
            loadGlobalUsersFromCloud();
        });

        let currentActiveUserCode = "7777";
        let uploadedPhotoData = "https://via.placeholder.com/150/38bdf8/ffffff?text=User";

        function convertImage(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedPhotoData = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            if(element) element.classList.add('active');

            if(pageId === 'profilePage') {
                renderProfileView(currentActiveUserCode);
            }
        }

        function addMoreLinkBox() {
            const container = document.getElementById('linksContainer');
            const newBox = document.createElement('input');
            newBox.type = 'url';
            newBox.className = 'social-link-input';
            newBox.placeholder = `App Link ${container.children.length + 1}`;
            container.appendChild(newBox);
        }

        // Register User & Save to Cloud Firestore
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const linkInputs = document.querySelectorAll('.social-link-input');
            let links = [];
            linkInputs.forEach(input => {
                if(input.value.trim() !== '') links.push(input.value.trim());
            });

            if(!name) { alert('Dhayachesi mee peru enter cheyandi!'); return; }

            let uniqueCode = Math.floor(1000 + Math.random() * 9000).toString();

            const userData = {
                code: uniqueCode,
                name: name,
                photo: uploadedPhotoData,
                links: links
            };

            try {
                await db.collection("users").doc(uniqueCode).set(userData);
                currentActiveUserCode = uniqueCode;
                alert(`Abhinandanalu! Mee Unique Code: ${uniqueCode}`);
                
                loadGlobalUsersFromCloud();
                switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
            } catch (error) {
                console.error("Error writing document: ", error);
                alert("Error saving data! Try again.");
            }
        }

        // Real-time Cloud Sync for Global List & 3D Earth Globe
        function loadGlobalUsersFromCloud() {
            const globalContainer = document.getElementById('globalUsersList');
            const globeSphere = document.getElementById('globeSphere');

            db.collection("users").onSnapshot((querySnapshot) => {
                globalContainer.innerHTML = '';
                globeSphere.innerHTML = '';

                let usersList = [];
                querySnapshot.forEach((doc) => {
                    let user = doc.data();
                    usersList.push(user);
                    
                    // Render in All Creators List
                    globalContainer.innerHTML += `
                        <div class="user-circle-card" onclick="viewUserDirectly('${user.code}')">
                            <img src="${user.photo}" class="profile-thumb" alt="${user.name}">
                            <span>${user.name}</span>
                        </div>
                    `;
                });

                if(usersList.length === 0) {
                    globalContainer.innerHTML = `<p style="color:#64748b; font-size:0.85rem;">No creators yet.</p>`;
                    return;
                }

                // Render 3D Earth Globe Sphere with scattered profiles
                const total = usersList.length;
                const radius = 100;

                usersList.forEach((user, idx) => {
                    const phi = Math.acos(-1 + (2 * idx) / total);
                    const theta = Math.sqrt(total * Math.PI) * phi;

                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);

                    const item = document.createElement('div');
                    item.className = 'globe-item';
                    item.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    item.onclick = () => viewUserDirectly(user.code);

                    item.innerHTML = `
                        <img src="${user.photo}" alt="${user.name}">
                        <span>${user.name}</span>
                    `;
                    globeSphere.appendChild(item);
                });
            });
        }

        // Search Profile by Code from Cloud
        async function searchByCode() {
            const inputCode = document.getElementById('searchInput').value.trim();
            if(inputCode.length !== 4) {
                alert('Sarigga 4-ankela code enter cheyandi!');
                return;
            }

            const docRef = db.collection("users").doc(inputCode);
            const doc = await docRef.get();

            if (doc.exists) {
                currentActiveUserCode = inputCode;
                switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
            } else {
                alert('Ee code ki e profile dorakaledhu!');
            }
        }

        function viewUserDirectly(code) {
            currentActiveUserCode = code;
            switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
        }

        // Render Profile View
        async function renderProfileView(code) {
            const profileContainer = document.getElementById('profileContainer');
            
            const docRef = db.collection("users").doc(code);
            const doc = await docRef.get();

            if(!doc.exists) {
                profileContainer.innerHTML = `<p style="text-align:center;">E profile enchukoledhu.</p>`;
                return;
            }

            let user = doc.data();
            let linksHTML = user.links && user.links.length > 0 
                ? user.links.map(link => `<a href="${link}" target="_blank" class="link-item">🔗 ${link}</a>`).join('')
                : '<p style="color:#64748b;">No links added</p>';

            profileContainer.innerHTML = `
                <div class="insta-profile-card">
                    <img src="${user.photo}" class="insta-avatar">
                    <h2 style="color:#fff; margin-bottom: 5px;">${user.name}</h2>
                    <div class="insta-code-badge">Code: ${code}</div>
                    <div style="margin-top: 15px;">
                        ${linksHTML}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
