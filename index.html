<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Line - Social Hub</title>
    
    <!-- Firebase App, Firestore & Analytics CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            z-index: 10;
        }

        .top-bar-title {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .live-counter-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        #splashScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }

        .splash-logo-img {
            width: 180px;
            max-width: 70%;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .page { display: none; }
        .page.active { display: block; }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }

        input:focus { outline: none; border-color: #38bdf8; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #0284c7, #2563eb);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add {
            background: #334155;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* 3D GOOGLE MAPS STYLE EARTH GLOBE CONTAINER */
        .globe-container {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 15px auto 25px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.25) 0%, rgba(11, 15, 25, 0.9) 75%);
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.4);
            box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.3), 0 0 25px rgba(2, 132, 199, 0.4);
        }

        .globe-sphere {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateGlobe 22s linear infinite;
        }

        .globe-sphere:hover {
            animation-play-state: paused;
        }

        /* MAP PIN & PROFILE STYLE */
        .globe-map-pin {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 58px;
            margin-left: -24px;
            margin-top: -58px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .globe-map-pin img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ef4444; /* Google Map Red border indicator */
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            background: #111827;
        }

        .map-pin-pointer {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #ef4444; /* Red map marker tail */
            margin-top: -3px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        .globe-map-pin span {
            position: absolute;
            bottom: -18px;
            font-size: 0.6rem;
            color: #cbd5e1;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.9);
            padding: 1px 6px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        @keyframes rotateGlobe {
            0% { transform: rotateY(0deg) rotateX(12deg); }
            100% { transform: rotateY(360deg) rotateX(12deg); }
        }

        .global-section h3 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .global-users {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .user-circle-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            cursor: pointer;
        }

        .profile-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            padding: 2px;
        }

        .user-circle-card span {
            font-size: 0.75rem;
            margin-top: 5px;
            color: #cbd5e1;
            text-align: center;
            max-width: 70px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .insta-profile-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
        }

        .insta-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
        }

        .insta-code-badge {
            display: inline-block;
            background: #0284c7;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .link-item {
            display: block;
            background: #0f172a;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #334155;
            word-break: break-all;
        }

        /* RATING WIDGET */
        .rating-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin-top: 25px;
        }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 1.8rem;
            cursor: pointer;
            margin: 10px 0;
        }

        .star {
            color: #475569;
            transition: color 0.2s;
        }

        .star.selected {
            color: #f59e0b;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 65px;
            background-color: #0f172a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1e293b;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-bar">
            <span class="top-bar-title">PRACTICAL LINE</span>
            <div class="live-counter-badge" id="liveCounterBadge">👥 Joined: 0</div>
        </div>

        <div id="splashScreen">
            <img src="logo.png" class="splash-logo-img" alt="Practical Logo">
            <div class="loader"></div>
        </div>

        <div class="main-content">

            <div id="searchPage" class="page active">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Search Profile</h2>
                <div class="search-box">
                    <input type="number" id="searchInput" placeholder="Enter 4-Digit Code" maxlength="4">
                    <button class="btn" style="width: auto; padding: 0 20px;" onclick="searchByCode()">Search</button>
                </div>

                <!-- 3D GOOGLE MAPS STYLE EARTH GLOBE -->
                <div class="global-section">
                    <h3>Live Google Map Earth Pins</h3>
                    <div class="globe-container">
                        <div class="globe-sphere" id="globeSphere"></div>
                    </div>
                </div>

                <div class="global-section">
                    <h3>All Global Creators</h3>
                    <div class="global-users" id="globalUsersList"></div>
                </div>

                <!-- WEBSITE RATING SECTION -->
                <div class="rating-box">
                    <h3 style="font-size: 1rem; color: #cbd5e1;">Rate Our Website</h3>
                    <div class="stars-container" id="starsContainer">
                        <span class="star" onclick="rateApp(1)">★</span>
                        <span class="star" onclick="rateApp(2)">★</span>
                        <span class="star" onclick="rateApp(3)">★</span>
                        <span class="star" onclick="rateApp(4)">★</span>
                        <span class="star" onclick="rateApp(5)">★</span>
                    </div>
                    <p id="ratingStatus" style="font-size: 0.8rem; color: #94a3b8;">Click stars to rate!</p>
                </div>
            </div>

            <div id="joinPage" class="page">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Join Practical Line</h2>
                
                <input type="text" id="regName" placeholder="Mee Peru (Full Name)">
                
                <label style="font-size: 0.85rem; color: #94a3b8; display:block; margin: 5px 0;">Mee Photo Select Cheyandi:</label>
                <input type="file" id="regPhotoFile" accept="image/*" onchange="convertAndCompressImage(event)" style="padding: 10px; margin-bottom: 12px;">

                <label style="font-size: 0.85rem; color: #94a3b8; display:block; margin: 10px 0 5px;">Social Media Links:</label>
                <div id="linksContainer">
                    <input type="url" class="social-link-input" placeholder="App Link 1 (e.g. Instagram)">
                    <input type="url" class="social-link-input" placeholder="App Link 2 (e.g. YouTube)">
                    <input type="url" class="social-link-input" placeholder="App Link 3 (e.g. Moj)">
                </div>

                <button class="btn btn-add" onclick="addMoreLinkBox()">+ Add More Link</button>
                <button class="btn" onclick="registerUser()">Generate Code & Join</button>
            </div>

            <div id="profilePage" class="page">
                <div id="profileContainer"></div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('searchPage', this)">
                <div class="nav-icon">🔍</div>
                <div>Search</div>
            </div>
            <div class="nav-item" onclick="switchPage('joinPage', this)">
                <div class="nav-icon">➕</div>
                <div>Join</div>
            </div>
            <div class="nav-item" onclick="switchPage('profilePage', this)">
                <div class="nav-icon">👤</div>
                <div>Profile</div>
            </div>
        </div>

    </div>

    <script>
        // --- REAL FIREBASE CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyDe0CXHpSv5q9xmjJroSe8B7BVCdQA6wfM",
          authDomain: "practical-line-683de.firebaseapp.com",
          projectId: "practical-line-683de",
          storageBucket: "practical-line-683de.firebasestorage.app",
          messagingSenderId: "11132140502",
          appId: "1:11132140502:web:531aeedc2ff0600a908277",
          measurementId: "G-BDYQN35K2T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const analytics = firebase.analytics();

        let currentActiveUserCode = "";
        let uploadedPhotoData = "https://via.placeholder.com/150/38bdf8/ffffff?text=User";

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2000);
            loadGlobalUsersFromCloud();
        });

        function convertAndCompressImage(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxSize = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                        } else {
                            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        uploadedPhotoData = canvas.toDataURL('image/jpeg', 0.7);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            if(element) element.classList.add('active');

            if(pageId === 'profilePage' && currentActiveUserCode) {
                renderProfileView(currentActiveUserCode);
            }
        }

        function addMoreLinkBox() {
            const container = document.getElementById('linksContainer');
            const newBox = document.createElement('input');
            newBox.type = 'url';
            newBox.className = 'social-link-input';
            newBox.placeholder = `App Link ${container.children.length + 1}`;
            container.appendChild(newBox);
        }

        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const linkInputs = document.querySelectorAll('.social-link-input');
            let links = [];
            linkInputs.forEach(input => {
                if(input.value.trim() !== '') links.push(input.value.trim());
            });

            if(!name) { alert('దయచేసి మీ పేరు ఎంటర్ చేయండి!'); return; }

            let uniqueCode;
            let docExists = true;
            let attempts = 0;

            while (docExists && attempts < 10) {
                uniqueCode = Math.floor(1000 + Math.random() * 9000).toString();
                const docCheck = await db.collection("users").doc(uniqueCode).get();
                if (!docCheck.exists) {
                    docExists = false;
                }
                attempts++;
            }

            const userData = {
                code: uniqueCode,
                name: name,
                photo: uploadedPhotoData,
                links: links,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("users").doc(uniqueCode).set(userData);
                currentActiveUserCode = uniqueCode;
                alert(`అభిప్రాయాలు విజయవంతం! మీ Unique Code: ${uniqueCode}`);
                
                switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
            } catch (error) {
                console.error("Error saving data: ", error);
                alert("డేటా సేవ్ చేయడంలో సమస్య ఏర్పడింది. మళ్లీ ప్రయత్నించండి.");
            }
        }

        // Real-time Cloud Sync with Google Maps Style Pins on Rotating Globe
        function loadGlobalUsersFromCloud() {
            const globalContainer = document.getElementById('globalUsersList');
            const globeSphere = document.getElementById('globeSphere');
            const counterBadge = document.getElementById('liveCounterBadge');

            db.collection("users").onSnapshot((querySnapshot) => {
                globalContainer.innerHTML = '';
                globeSphere.innerHTML = '';

                let usersList = [];
                querySnapshot.forEach((doc) => {
                    let user = doc.data();
                    usersList.push(user);
                    
                    globalContainer.innerHTML += `
                        <div class="user-circle-card" onclick="viewUserDirectly('${user.code}')">
                            <img src="${user.photo}" class="profile-thumb" alt="${user.name}">
                            <span>${user.name}</span>
                        </div>
                    `;
                });

                counterBadge.innerText = `👥 Joined: ${usersList.length}`;

                if(usersList.length === 0) {
                    globalContainer.innerHTML = `<p style="color:#64748b; font-size:0.85rem;">No creators yet.</p>`;
                    return;
                }

                const total = usersList.length;
                const radius = 105;

                usersList.forEach((user, idx) => {
                    const phi = Math.acos(-1 + (2 * idx) / total);
                    const theta = Math.sqrt(total * Math.PI) * phi;

                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);

                    const item = document.createElement('div');
                    item.className = 'globe-map-pin';
                    item.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    item.onclick = () => viewUserDirectly(user.code);

                    item.innerHTML = `
                        <img src="${user.photo}" alt="${user.name}">
                        <div class="map-pin-pointer"></div>
                        <span>${user.name}</span>
                    `;
                    globeSphere.appendChild(item);
                });
            });
        }

        async function searchByCode() {
            const inputCode = document.getElementById('searchInput').value.trim();
            if(inputCode.length !== 4) {
                alert('సరిగ్గా 4-అంకెల కోడ్ ఎంటర్ చేయండి!');
                return;
            }

            try {
                const docRef = db.collection("users").doc(inputCode);
                const doc = await docRef.get();

                if (doc.exists) {
                    currentActiveUserCode = inputCode;
                    switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
                } else {
                    alert('ఈ కోడ్‌తో ఏ ప్రొఫైల్ దొరకలేదు!');
                }
            } catch (error) {
                console.error("Search error: ", error);
                alert("సెర్చ్ చేయడంలో లోపం ఏర్పడింది.");
            }
        }

        function viewUserDirectly(code) {
            currentActiveUserCode = code;
            switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
        }

        async function renderProfileView(code) {
            const profileContainer = document.getElementById('profileContainer');
            
            try {
                const docRef = db.collection("users").doc(code);
                const doc = await docRef.get();

                if(!doc.exists) {
                    profileContainer.innerHTML = `<p style="text-align:center;">ఈ ప్రొఫైల్ అందుబాటులో లేదు.</p>`;
                    return;
                }

                let user = doc.data();
                let linksHTML = user.links && user.links.length > 0 
                    ? user.links.map(link => `<a href="${link}" target="_blank" class="link-item">🔗 ${link}</a>`).join('')
                    : '<p style="color:#64748b;">No links added</p>';

                profileContainer.innerHTML = `
                    <div class="insta-profile-card">
                        <img src="${user.photo}" class="insta-avatar">
                        <h2 style="color:#fff; margin-bottom: 5px;">${user.name}</h2>
                        <div class="insta-code-badge">Code: ${code}</div>
                        <div style="margin-top: 15px;">
                            ${linksHTML}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error("Profile load error: ", error);
                profileContainer.innerHTML = `<p style="text-align:center; color:#ef4444;">ప్రొఫైల్ లోడ్ చేయడంలో విఫలమైంది.</p>`;
            }
        }

        async function rateApp(stars) {
            const starsElements = document.querySelectorAll('.star');
            starsElements.pop = starsElements.forEach((star, index) => {
                if (index < stars) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });

            document.getElementById('ratingStatus').innerText = `Thank you for rating us ${stars} Stars! ⭐`;

            try {
                await db.collection("ratings").add({
                    rating: stars,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.log("Rating save error", e);
            }
        }
    </script>
</body>
</html>
