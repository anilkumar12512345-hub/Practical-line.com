<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Line</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js for Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glow-effect { box-shadow: 0 0 25px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20">

    <!-- Header -->
    <header class="w-full bg-gray-900/80 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wider text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-globe"></i> PRACTICAL LINE
        </h1>
        <div id="member-count-badge" class="bg-blue-600/20 border border-blue-500/30 text-blue-400 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-2">
            <i class="fa-solid fa-users"></i> Joined: <span id="live-count">0</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        
        <!-- Search Bar -->
        <div class="w-full max-w-md mb-4 flex gap-2 z-10">
            <input type="text" id="search-input" placeholder="Enter 4-Digit Code" maxlength="4" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold transition">Search</button>
        </div>

        <!-- 3D Globe Container -->
        <div class="w-full max-w-lg h-[350px] relative rounded-2xl overflow-hidden border border-gray-800 glow-effect bg-black">
            <div id="globe-container" class="w-full h-full"></div>
            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur px-3 py-1 rounded-lg text-xs text-gray-300 border border-gray-800">
                <i class="fa-solid fa-location-dot text-red-500"></i> Live Google Map Earth Pins
            </div>
        </div>

        <!-- Global Creators / Members List -->
        <div class="w-full max-w-md mt-6">
            <h2 class="text-lg font-bold mb-3 text-gray-200">All Global Creators</h2>
            <div id="members-list" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <!-- Dynamic members list will load here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full bg-gray-900/90 backdrop-blur border-t border-gray-800 flex justify-around py-3 z-50">
        <button onclick="switchTab('search')" class="flex flex-col items-center text-blue-400">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-xs mt-1">Search</span>
        </button>
        <button onclick="openJoinModal()" class="flex flex-col items-center text-gray-400 hover:text-white">
            <div class="bg-blue-600 text-white p-2 rounded-full -mt-5 shadow-lg border-4 border-gray-900">
                <i class="fa-solid fa-plus"></i>
            </div>
            <span class="text-xs mt-1">Join</span>
        </button>
        <button onclick="switchTab('profile')" class="flex flex-col items-center text-gray-400 hover:text-white">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs mt-1">Profile</span>
        </button>
    </nav>

    <!-- Join Modal -->
    <div id="join-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 relative my-8">
            <button onclick="closeJoinModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl font-bold mb-4 text-blue-400">Join Practical Line</h3>
            <form id="join-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Your Name</label>
                    <input type="text" id="join-name" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Upload Profile Photo</label>
                    <input type="file" id="join-img-file" accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
                </div>

                <!-- Dynamic Links Container -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs text-gray-400">Social Media Links</label>
                        <button type="button" onclick="addLinkField()" class="text-xs text-blue-400 hover:text-blue-300 font-semibold">+ Add Link</button>
                    </div>
                    <div id="links-container" class="space-y-2">
                        <div class="flex gap-2">
                            <select class="link-type bg-gray-800 border border-gray-700 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                                <option value="instagram">Instagram</option>
                                <option value="youtube">YouTube</option>
                                <option value="facebook">Facebook</option>
                                <option value="website">Website</option>
                            </select>
                            <input type="url" placeholder="https://..." class="link-url flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-semibold transition mt-2">Submit & Join</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD...",
            authDomain: "practical-line.firebaseapp.com",
            projectId: "practical-line",
            storageBucket: "practical-line.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allMembers = [];

        async function loadMembers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                window.allMembers = [];
                querySnapshot.forEach((doc) => {
                    window.allMembers.push({ id: doc.id, ...doc.data() });
                });
                document.getElementById('live-count').innerText = window.allMembers.length;
                renderMembersList(window.allMembers);
            } catch (e) {
                console.error("Error loading members: ", e);
            }
        }

        function renderMembersList(members) {
            const listContainer = document.getElementById('members-list');
            listContainer.innerHTML = '';
            if (members.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No members joined yet.</p>';
                return;
            }
            members.forEach(m => {
                let linksHtml = '';
                if (m.links && Array.isArray(m.links)) {
                    m.links.forEach(l => {
                        let icon = 'fa-globe text-gray-400';
                        if(l.type === 'instagram') icon = 'fa-brands fa-instagram text-pink-500';
                        if(l.type === 'youtube') icon = 'fa-brands fa-youtube text-red-500';
                        if(l.type === 'facebook') icon = 'fa-brands fa-facebook text-blue-500';
                        if(l.type === 'website') icon = 'fa-solid fa-globe text-green-400';
                        
                        linksHtml += `<a href="${l.url}" target="_blank" class="text-lg hover:scale-110 transition"><i class="${icon}"></i></a>`;
                    });
                }
                listContainer.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${m.img || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover border border-blue-500">
                            <div>
                                <h4 class="font-semibold text-sm text-white">${m.name}</h4>
                                <span class="text-xs text-gray-400">Code: <strong class="text-blue-400">${m.code}</strong></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            ${linksHtml}
                        </div>
                    </div>
                `;
            });
        }

        window.addLinkField = function() {
            const container = document.getElementById('links-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 mt-2';
            div.innerHTML = `
                <select class="link-type bg-gray-800 border border-gray-700 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                    <option value="instagram">Instagram</option>
                    <option value="youtube">YouTube</option>
                    <option value="facebook">Facebook</option>
                    <option value="website">Website</option>
                </select>
                <input type="url" placeholder="https://..." class="link-url flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        document.getElementById('join-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('join-name').value;
            const fileInput = document.getElementById('join-img-file');
            
            const code = Math.floor(1000 + Math.random() * 9000).toString();

            const linkElements = document.querySelectorAll('#links-container > div');
            let links = [];
            linkElements.forEach(el => {
                const type = el.querySelector('.link-type').value;
                const url = el.querySelector('.link-url').value;
                if(url) links.push({ type, url });
            });

            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = async function () {
                const img = reader.result;
                try {
                    await setDoc(doc(db, "users", code), { name, code, img, links });
                    alert(`Successfully Joined! Your Secret Code is: ${code}`);
                    closeJoinModal();
                    loadMembers();
                } catch (err) {
                    alert("Error joining: " + err.message);
                }
            };
        });

        loadMembers();
    </script>

    <!-- Three.js Globe Script -->
    <script>
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const geometry = new THREE.SphereGeometry(2, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x1e3a8a, wireframe: true, transparent: true, opacity: 0.3 });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        camera.position.z = 6;

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.openJoinModal = function() { document.getElementById('join-modal').classList.remove('hidden'); }
        window.closeJoinModal = function() { document.getElementById('join-modal').classList.add('hidden'); }
        window.switchTab = function(tab) { alert("Switched to " + tab); }
    </script>
</body>
</html>
