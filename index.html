<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Line - Social Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Mobile App Frame Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Top Header Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
        }

        .top-bar-logo {
            height: 35px;
            object-fit: contain;
        }

        .top-bar-title {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* 1. Splash Screen Loading Animation */
        #splashScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }

        .splash-logo-img {
            width: 180px;
            max-width: 70%;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        /* Main Content View Container */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Form Controls & Search Inputs */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }

        input:focus { outline: none; border-color: #38bdf8; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #0284c7, #2563eb);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add {
            background: #334155;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* Global Users Circle List */
        .global-section h3 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .global-users {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .user-circle-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            cursor: pointer;
        }

        .profile-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            padding: 2px;
        }

        .user-circle-card span {
            font-size: 0.75rem;
            margin-top: 5px;
            color: #cbd5e1;
            text-align: center;
            max-width: 70px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Profile Display (Instagram Card Style) */
        .insta-profile-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
        }

        .insta-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
        }

        .insta-code-badge {
            display: inline-block;
            background: #0284c7;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .link-item {
            display: block;
            background: #0f172a;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #334155;
            word-break: break-all;
        }

        /* Bottom Navigation Bar (Instagram Style) */
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 65px;
            background-color: #0f172a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1e293b;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Bar with Logo -->
        <div class="top-bar">
            <img src="logo.png" class="top-bar-logo" alt="Practical Logo">
            <span class="top-bar-title">PRACTICAL LINE</span>
        </div>

        <!-- Loading Animation Splash -->
        <div id="splashScreen">
            <img src="logo.png" class="splash-logo-img" alt="Practical Logo">
            <div class="loader"></div>
        </div>

        <!-- Main Dynamic Content Views -->
        <div class="main-content">

            <!-- PAGE 1: SEARCH & GLOBAL LIST -->
            <div id="searchPage" class="page active">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Search Profile</h2>
                <div class="search-box">
                    <input type="number" id="searchInput" placeholder="Enter 4-Digit Code" maxlength="4">
                    <button class="btn" style="width: auto; padding: 0 20px;" onclick="searchByCode()">Search</button>
                </div>

                <div class="global-section">
                    <h3>Global Creators</h3>
                    <div class="global-users" id="globalUsersList">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- PAGE 2: JOIN / REGISTER PAGE -->
            <div id="joinPage" class="page">
                <h2 style="color: #38bdf8; margin-bottom: 15px;">Join Practical Line</h2>
                
                <input type="text" id="regName" placeholder="Mee Peru (Full Name)">
                <input type="text" id="regPhoto" placeholder="Profile Pic Image URL">

                <label style="font-size: 0.85rem; color: #94a3b8; display:block; margin: 10px 0 5px;">Social Media Links:</label>
                <div id="linksContainer">
                    <input type="url" class="social-link-input" placeholder="App Link 1 (e.g. Instagram)">
                    <input type="url" class="social-link-input" placeholder="App Link 2 (e.g. YouTube)">
                    <input type="url" class="social-link-input" placeholder="App Link 3 (e.g. Moj)">
                </div>

                <button class="btn btn-add" onclick="addMoreLinkBox()">+ Add More Link</button>
                <button class="btn" onclick="registerUser()">Generate Code & Join</button>
            </div>

            <!-- PAGE 3: MY / CREATOR PROFILE VIEW -->
            <div id="profilePage" class="page">
                <div id="profileContainer">
                    <!-- Profile Details loaded dynamically -->
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('searchPage', this)">
                <div class="nav-icon">🔍</div>
                <div>Search</div>
            </div>
            <div class="nav-item" onclick="switchPage('joinPage', this)">
                <div class="nav-icon">➕</div>
                <div>Join</div>
            </div>
            <div class="nav-item" onclick="switchPage('profilePage', this)">
                <div class="nav-icon">👤</div>
                <div>Profile</div>
            </div>
        </div>

    </div>

    <script>
        // Splash screen hide after 2 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2000);
            renderGlobalUsers();
        });

        // Sample Pre-loaded Database
        let database = JSON.parse(localStorage.getItem('practicalLineDB')) || {
            "7777": {
                name: "Anil Kumar",
                photo: "https://via.placeholder.com/150/0284c7/ffffff?text=Anil",
                links: ["https://instagram.com", "https://youtube.com", "https://mojapp.in"]
            }
        };

        let currentActiveUserCode = "7777";

        // Navigation Page Switcher
        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            if(element) element.classList.add('active');

            if(pageId === 'profilePage') {
                renderProfileView(currentActiveUserCode);
            }
        }

        // Add Unlimited Extra Link Boxes
        function addMoreLinkBox() {
            const container = document.getElementById('linksContainer');
            const newBox = document.createElement('input');
            newBox.type = 'url';
            newBox.className = 'social-link-input';
            newBox.placeholder = `App Link ${container.children.length + 1}`;
            container.appendChild(newBox);
        }

        // Generate Random Unique 4-Digit Code & Register
        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const photo = document.getElementById('regPhoto').value.trim() || "https://via.placeholder.com/150/38bdf8/ffffff?text=User";
            
            const linkInputs = document.querySelectorAll('.social-link-input');
            let links = [];
            linkInputs.forEach(input => {
                if(input.value.trim() !== '') links.push(input.value.trim());
            });

            if(!name) { alert('Dhayachesi mee peru enter cheyandi!'); return; }

            // Create Unique 4 Digit Code
            let uniqueCode;
            do {
                uniqueCode = Math.floor(1000 + Math.random() * 9000).toString();
            } while (database[uniqueCode]);

            database[uniqueCode] = { name, photo, links };
            localStorage.setItem('practicalLineDB', JSON.stringify(database));

            currentActiveUserCode = uniqueCode;
            alert(`Abhinandanalu! Mee Unique Code: ${uniqueCode}`);
            
            renderGlobalUsers();
            switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
        }

        // Render Global User Avatars list
        function renderGlobalUsers() {
            const globalContainer = document.getElementById('globalUsersList');
            globalContainer.innerHTML = '';

            for (let code in database) {
                let user = database[code];
                globalContainer.innerHTML += `
                    <div class="user-circle-card" onclick="viewUserDirectly('${code}')">
                        <img src="${user.photo}" class="profile-thumb" alt="${user.name}">
                        <span>${user.name}</span>
                    </div>
                `;
            }
        }

        // Search Profile by 4-Digit Code
        function searchByCode() {
            const inputCode = document.getElementById('searchInput').value.trim();
            if(inputCode.length !== 4) {
                alert('Sarigga 4-ankela code enter cheyandi!');
                return;
            }

            if(database[inputCode]) {
                currentActiveUserCode = inputCode;
                switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
            } else {
                alert('Ee code ki e profile dorakaledhu!');
            }
        }

        function viewUserDirectly(code) {
            currentActiveUserCode = code;
            switchPage('profilePage', document.querySelectorAll('.nav-item')[2]);
        }

        // Render Creator Profile Page (Instagram Style)
        function renderProfileView(code) {
            const profileContainer = document.getElementById('profileContainer');
            const user = database[code];

            if(!user) {
                profileContainer.innerHTML = `<p style="text-align:center;">E profile enchukoledhu.</p>`;
                return;
            }

            let linksHTML = user.links.map(link => `<a href="${link}" target="_blank" class="link-item">🔗 ${link}</a>`).join('');

            profileContainer.innerHTML = `
                <div class="insta-profile-card">
                    <img src="${user.photo}" class="insta-avatar">
                    <h2 style="color:#fff; margin-bottom: 5px;">${user.name}</h2>
                    <div class="insta-code-badge">Code: ${code}</div>
                    <div style="margin-top: 15px;">
                        ${linksHTML || '<p style="color:#64748b;">No links added</p>'}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
